
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>SIS — NIGHT CITY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sis-app">

    <header class="sis-header">
      <button id="menuToggle" class="menu-toggle"
        aria-label="فتح القائمة" aria-expanded="false">☰</button>

      <div class="brand">
        <span class="brand-mark">SIS</span>
        <div>
          <strong>SIS — NIGHT CITY</strong>
          <small>INTELLIGENCE SYSTEM</small>
        </div>
      </div>
    </header>

    <div id="menuOverlay" class="menu-overlay"></div>

    <aside id="sidebar" class="sis-sidebar" aria-hidden="true">
      <div class="sidebar-top">
        <strong>القائمة الرئيسية</strong>
        <button id="menuClose" aria-label="إغلاق القائمة">✕</button>
      </div>

      <nav>
        <button class="nav-link active" data-page="home">الرئيسية</button>
        <button class="nav-link" data-page="network">NETWORK</button>
        <button class="nav-link" data-page="people">الأشخاص</button>
        <button class="nav-link" data-page="files">الملفات</button>
        <button class="nav-link" data-page="reports">التقارير</button>
        <button class="nav-link" data-page="search">البحث المركزي</button>
        <button class="nav-link" data-page="ai">SIS AI</button>
        <button class="nav-link" data-page="archive">الأرشيف</button>
        <button class="nav-link" data-page="settings">الإعدادات</button>
      </nav>

      <div class="sidebar-footer">SIS SYSTEM © 2026</div>
    </aside>

    <main class="sis-main">
      <div class="page-heading">
        <div>
          <h1 id="pageTitle">مركز القيادة</h1>
          <p id="pageSubtitle">مرحبًا بك في SIS — NIGHT CITY</p>
        </div>
        <span class="system-version">VERSION 1.0</span>
      </div>

      <section id="pageContent" class="page-content">
        <div class="loading-state">جاري تجهيز النظام...</div>
      </section>
    </main>

    <div id="sisToast" class="sis-toast" role="status"></div>
    <div id="sisModal" class="sis-modal" hidden></div>

  </div>

  <script src="sis-system.js"></script>
  <script src="pages.js"></script>
  <script src="app.js"></script>
</body>
</html>
