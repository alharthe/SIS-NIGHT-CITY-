
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>SIS — NIGHT CITY</title>
<style>
:root{--bg:#090909;--panel:#141414;--red:#e3263a;--gold:#c8a45d;--text:#f4f4f4;--muted:#aaa;--line:#303030}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{padding:20px;background:#111;border-bottom:2px solid var(--red);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-size:23px;font-weight:bold;color:var(--red)}
.logo span{color:var(--gold)}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px;background:#101010}
nav button,.btn{background:#202020;color:white;border:1px solid var(--line);padding:11px 15px;border-radius:9px}
nav button:hover,.btn:hover{border-color:var(--red)}
main{max-width:1100px;margin:auto;padding:18px}
h1,h2{margin-top:8px}
h2{color:var(--gold)}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.stat{font-size:28px;color:var(--red);font-weight:bold}
input,textarea,select{width:100%;padding:12px;margin:6px 0 12px;background:#0c0c0c;color:white;border:1px solid var(--line);border-radius:8px}
textarea{min-height:90px;resize:vertical}
.primary{background:var(--red);border:0;color:white;padding:12px 18px;border-radius:9px}
.item{padding:13px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.item strong{color:var(--gold)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);padding:24px}
#toast{position:fixed;bottom:20px;left:15px;right:15px;max-width:420px;margin:auto;background:#222;border:1px solid var(--red);padding:14px;border-radius:10px;display:none;z-index:9}
@media(max-width:500px){header{align-items:flex-start}nav button{flex:1}main{padding:12px}}
</style>
</head>
<body>
<header>
<div class="logo">SIS <span>— NIGHT CITY</span></div>
<div class="muted">نظام المعلومات والشبكات</div>
</header>
<nav id="nav" class="hidden">
<button onclick="show('home')">الرئيسية</button>
<button onclick="show('people')">الأشخاص</button>
<button onclick="show('files')">الملفات</button>
<button onclick="show('tasks')">المهام</button>
<button onclick="show('settings')">الإعدادات</button>
<button onclick="logout()">خروج</button>
</nav>
<main>
<section id="login" class="card">
<h1>SIS ACCESS</h1>
<p class="muted">تسجيل الدخول إلى NIGHT CITY</p>
<label>اسم المستخدم</label>
<input id="username" placeholder="أدخل اسم المستخدم" autocomplete="username">
<label>كلمة المرور</label>
<input id="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
<button class="primary" onclick="login()">دخول النظام</button>
<p class="muted">نسخة تجريبية محلية وليست نظامًا آمنًا حقيقيًا.</p>
</section>
<section id="app" class="hidden">
<div id="content"></div>
</section>
</main>
<div id="toast"></div>
<footer>SIS — NIGHT CITY © 2026</footer>
<script>
const $=id=>document.getElementById(id);
const read=()=>{try{return JSON.parse(localStorage.getItem('sisDB'))||{people:[],files:[],tasks:[]}}catch{return {people:[],files:[],tasks:[]}}};
let db=read(),page='home';
function save(){localStorage.setItem('sisDB',JSON.stringify(db))}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function login(){if(!$('username').value.trim()||!$('password').value){toast('أدخل بيانات الدخول');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');show('home')}
function logout(){$('app').classList.add('hidden');$('nav').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''}
function show(p){page=p;render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function form(title,fields,fn){return `<div class="card"><h2>${title}</h2><form onsubmit="${fn}(event)">${fields}<button class="primary">حفظ البيانات</button></form></div>`}
function field(label,id,placeholder){return `<label>${label}</label><input id="${id}" required placeholder="${placeholder}">`}
function list(type){return db[type].map((x,i)=>`<div class="item"><strong>${esc(x.name)}</strong><p>${esc(x.info||'لا توجد تفاصيل')}</p><div class="actions"><button class="btn" onclick="del('${type}',${i})">حذف</button></div></div>`).join('')||'<p class="muted">لا توجد سجلات حتى الآن.</p>'}
function del(type,i){if(confirm('هل تريد حذف هذا السجل؟')){db[type].splice(i,1);save();render();toast('تم الحذف')}}
function add(type,name,info){db[type].unshift({name,info,date:new Date().toLocaleDateString('ar')});save();render();toast('تم حفظ السجل')}
function submitItem(e,type){e.preventDefault();let name=e.target.name.value.trim(),info=e.target.info.value.trim();if(name)add(type,name,info)}
function render(){
let c='';
if(page==='home')c=`<h1>مركز العمليات</h1><p class="muted">مرحبًا بك في SIS — NIGHT CITY</p><div class="grid">${[['الأشخاص','people'],['الملفات','files'],['المهام','tasks']].map(([n,k])=>`<div class="card"><h2>${n}</h2><div class="stat">${db[k].length}</div><button class="btn" onclick="show('${k}')">فتح القسم</button></div>`).join('')}</div><div class="card"><h2>حالة النظام</h2><p>واجهة النظام تعمل محليًا على هذا المتصفح.</p><button class="btn" onclick="backup()">تصدير نسخة احتياطية</button></div>`;
if(page==='people')c=`<h1>إدارة الأشخاص</h1>${form('إضافة شخص',field('الاسم','name','الاسم أو المعرف')+`<label>المعلومات</label><textarea id="info" placeholder="أضف التفاصيل"></textarea>`,'addPerson')}<div class="card"><h2>السجلات</h2>${list('people')}</div>`;
if(page==='files')c=`<h1>الملفات والتقارير</h1>${form('إضافة ملف',field('العنوان','name','عنوان الملف')+`<label>التفاصيل</label><textarea id="info" placeholder="ملخص التقرير"></textarea>`,'addFile')}<div class="card"><h2>الأرشيف</h2>${list('files')}</div>`;
if(page==='tasks')c=`<h1>إدارة المهام</h1>${form('مهمة جديدة',field('اسم المهمة','name','عنوان المهمة')+`<label>الوصف</label><textarea id="info" placeholder="تفاصيل المهمة"></textarea>`,'addTask')}<div class="card"><h2>المهام المسجلة</h2>${list('tasks')}</div>`;
if(page==='settings')c=`<h1>الإعدادات</h1><div class="card"><h2>النسخ الاحتياطي</h2><p>احفظ بياناتك أو استعد نسخة JSON سابقة.</p><button class="btn" onclick="backup()">تصدير البيانات</button><input type="file" accept=".json,application/json" onchange="restore(event)"><button class="btn" onclick="if(confirm('حذف جميع السجلات؟')){db={people:[],files:[],tasks:[]};save();render()}">مسح السجلات</button></div>`;
$('content').innerHTML=c;
}
function addPerson(e){submitItem(e,'people')}
function addFile(e){submitItem(e,'files')}
function addTask(e){submitItem(e,'tasks')}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='SIS-NIGHT-CITY-backup.json';a.click();URL.revokeObjectURL(u);toast('تم تجهيز النسخة')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||!Array.isArray(d.people)||!Array.isArray(d.files)||!Array.isArray(d.tasks))throw Error();if(confirm('استبدال السجلات الحالية بالنسخة؟')){db=d;save();render();toast('تم الاستيراد')}}catch{toast('ملف النسخة غير صالح')}};r.readAsText(f)}
</script>
</body>
</html>
