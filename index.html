

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>SIS — NIGHT CITY</title>
<style>
:root{--bg:#080d18;--panel:#101827;--panel2:#151f30;--gold:#d7b56d;--gold2:#f1d99c;--text:#f4f0e6;--muted:#9aa7ba;--border:#28344a;--red:#d84b55}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#142039 0,#080d18 55%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.topbar{height:65px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0b1220;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.brand{font-weight:bold;letter-spacing:2px;color:var(--gold);font-size:19px}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:4px}
.menu-btn,.icon-btn{background:var(--panel2);color:var(--gold);border:1px solid var(--border);border-radius:9px;padding:9px 12px}
.top-status{margin-right:auto;color:#85d6ad;font-size:11px}
.sidebar{position:fixed;z-index:9;right:0;top:65px;bottom:0;width:min(285px,84vw);padding:15px;background:#0b1220;border-left:1px solid var(--border);overflow:auto;transform:translateX(105%);transition:.22s}
.sidebar.open{transform:translateX(0)}
.overlay{position:fixed;inset:65px 0 0;background:#0009;z-index:8;display:none}
.overlay.show{display:block}
.nav-label{color:var(--gold);font-size:11px;margin:15px 10px 8px}
.nav-btn{width:100%;text-align:right;display:flex;align-items:center;gap:12px;padding:12px;margin:4px 0;background:transparent;color:#cbd3e0;border:1px solid transparent;border-radius:9px}
.nav-btn.active,.nav-btn:hover{background:#182337;border-color:#4c442e;color:var(--gold2)}
.nav-btn span:first-child{width:23px;text-align:center}
main{padding:20px 15px 50px;max-width:1050px;margin:auto}
.eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px}
h1{font-size:24px;margin:9px 0}
.subtitle{color:var(--muted);font-size:13px;line-height:1.8}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}
.stat,.panel,.item-card{background:linear-gradient(145deg,#121c2c,#0d1421);border:1px solid var(--border);border-radius:13px;padding:15px}
.stat strong{display:block;font-size:25px;color:var(--gold);margin-bottom:8px}
.stat span{font-size:12px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 13px}
.section-head h2{font-size:17px;margin:0}
.btn{border:1px solid #8c7547;background:linear-gradient(135deg,#d9bb79,#a9894a);color:#111827;padding:10px 13px;border-radius:8px;font-weight:bold}
.btn.secondary{background:#182337;color:var(--gold2);border-color:var(--border)}
.btn.danger{background:#3b1821;color:#ffb6bc;border-color:#6c3038}
.btn.small{padding:7px 9px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.item-card{min-width:0}
.item-card h3{margin:8px 0;font-size:16px;overflow-wrap:anywhere}
.item-card p{font-size:12px;line-height:1.7;color:var(--muted);overflow-wrap:anywhere}
.card-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tag{display:inline-block;font-size:10px;border:1px solid #655635;color:var(--gold2);padding:5px 8px;border-radius:30px;margin:3px}
.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field textarea,.field select,.search{width:100%;background:#090f1a;color:var(--text);border:1px solid var(--border);padding:12px;border-radius:8px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus,.search:focus{border-color:var(--gold)}
.field textarea{min-height:95px;resize:vertical}
.row{display:grid;grid-template-columns:1fr;gap:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar .search{flex:1;min-width:150px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;line-height:1.8}
.avatar{width:55px;height:55px;border-radius:12px;object-fit:cover;border:1px solid #625536;background:#1b2638}
.person-head{display:flex;align-items:center;gap:12px}
.badge{font-size:10px;color:#f1d99c;background:#322b1d;border-radius:5px;padding:5px 7px}
.modal{position:fixed;inset:0;z-index:20;background:#000b;display:none;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modal-box{background:#0d1523;border:1px solid #655635;border-radius:14px;padding:18px;width:min(550px,100%);max-height:90vh;overflow:auto}
.modal-box h2{margin-top:0;color:var(--gold2);font-size:19px}
.modal-actions{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:15px;right:15px;margin:auto;width:max-content;max-width:90%;z-index:30;background:#1a2b25;color:#baf2d4;border:1px solid #3c755c;padding:12px 16px;border-radius:9px;display:none}
footer{text-align:center;color:#66758b;font-size:11px;padding:20px}
hr{border:0;border-top:1px solid var(--border);margin:17px 0}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.row.two{grid-template-columns:1fr 1fr}main{padding:28px 24px 50px}}
</style>
</head>
<body>
<header class="topbar">
<button class="menu-btn" id="menuBtn" aria-label="فتح القائمة">☰</button>
<div class="brand">SIS <small>NIGHT CITY INTELLIGENCE</small></div>
<div class="top-status">● SYSTEM ONLINE</div>
</header>

<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
<div class="nav-label">القائمة الرئيسية</div>
<button class="nav-btn active" data-page="home"><span>⌂</span> الرئيسية</button>
<button class="nav-btn" data-page="network"><span>◎</span> NETWORK — الشبكات</button>
<button class="nav-btn" data-page="people"><span>♙</span> الأشخاص</button>
<button class="nav-btn" data-page="files"><span>▤</span> الملفات</button>
<button class="nav-btn" data-page="reports"><span>▧</span> التقارير والقضايا</button>
<button class="nav-btn" data-page="search"><span>⌕</span> البحث المركزي</button>
<div class="nav-label">إدارة النظام</div>
<button class="nav-btn" data-page="tasks"><span>✓</span> المهام</button>
<button class="nav-btn" data-page="members"><span>♧</span> الأعضاء</button>
<button class="nav-btn" data-page="archive"><span>▣</span> الأرشيف</button>
<button class="nav-btn" data-page="map"><span>⌖</span> المواقع</button>
<button class="nav-btn" data-page="ai"><span>✧</span> SIS AI</button>
<button class="nav-btn" data-page="settings"><span>⚙</span> الإعدادات</button>
</aside>

<main id="app"></main>
<footer>SIS — NIGHT CITY © 2026 · LOCAL WORKSPACE</footer>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
