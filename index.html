
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0e">
<title>SIS — NIGHT CITY</title>
<style>
:root {
  --bg:#090a0e;
  --panel:#13151d;
  --panel2:#1b1e28;
  --border:#303441;
  --text:#f3f3f7;
  --muted:#9da4b4;
  --red:#e3263a;
  --accent:#e3263a;
}
*{box-sizing:border-box}
body {
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid #c4a15a;outline-offset:2px
}
header {
  padding:17px 20px;background:#101117;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;position:sticky;top:0;z-index:5
}
.brand{display:flex;align-items:center;gap:12px}
.logo {
  width:44px;height:44px;border:1px solid var(--red);
  border-radius:12px;display:grid;place-items:center;
  font-weight:bold;background:#261018
}
h1{font-size:17px;margin:0}
header p{font-size:11px;color:var(--muted);margin:5px 0 0}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:90vh}
aside{background:#0e1016;border-left:1px solid var(--border);padding:15px}
nav button,.mobile-nav button{
  width:100%;padding:12px;margin:3px 0;border:1px solid transparent;
  border-radius:9px;background:transparent;color:#c4c8d2;text-align:right
}
nav button:hover,.mobile-nav button:hover{background:var(--panel2)}
nav button.active,.mobile-nav button.active{
  background:#30131b;border-color:#672532;color:white
}
main{padding:24px;min-width:0}
h2{font-size:25px;margin:0 0 9px}
.sub{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:22px}
.btn {
  border:1px solid var(--border);border-radius:9px;padding:10px 13px;
  background:var(--panel2);color:white;font-size:12px
}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.danger{background:#301219;border-color:#7b2835;color:#ffb9c1}
.btn:hover{filter:brightness(1.15)}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}
input,textarea,select{
  background:#0d0f15;color:white;border:1px solid var(--border);
  border-radius:9px;padding:11px;width:100%;min-width:0
}
.search{flex:1;min-width:170px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}
.stat,.card,.panel{
  background:var(--panel);border:1px solid var(--border);
  border-radius:13px;padding:15px;min-width:0
}
.stat span{font-size:12px;color:var(--muted)}
.stat strong{display:block;font-size:27px;margin-top:10px}
.card{transition:.2s}
.card:hover{border-color:#7a2938;transform:translateY(-2px)}
.card h3{font-size:15px;margin:0 0 9px;overflow-wrap:anywhere}
.card p{font-size:12px;color:var(--muted);line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.card-actions .btn{padding:7px 9px}
.dash{min-height:130px;text-align:right;color:white}
.dash .symbol{font-size:24px;margin-bottom:15px}
.dash small{display:block;color:var(--muted);margin-top:8px}
.empty{
  grid-column:1/-1;text-align:center;padding:35px 15px;
  border:1px dashed var(--border);border-radius:12px;color:var(--muted)
}
.empty h3{color:white;font-size:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;color:#cdd1dc}
.full{grid-column:1/-1}
.field textarea{min-height:100px;resize:vertical}
.field small{font-size:10px;color:var(--muted);line-height:1.7}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;gap:7px;align-items:center;border:1px solid var(--border);padding:8px;border-radius:8px;font-size:12px}
.checks input{width:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.notice{margin-top:20px;padding:14px;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:12px;line-height:1.9}
.notice b{color:#d9b66e}
#toast{
  position:fixed;bottom:20px;left:15px;background:#20232d;
  border:1px solid var(--border);padding:13px 16px;border-radius:10px;
  z-index:20;display:none;max-width:90vw;font-size:12px
}
#modal{
  display:none;position:fixed;inset:0;background:#000b;z-index:15;
  align-items:center;justify-content:center;padding:15px
}
.modal-box{
  width:min(650px,100%);max-height:90vh;overflow:auto;
  background:#11131b;border:1px solid var(--border);
  border-radius:15px;padding:18px
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h3{margin:0;font-size:17px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;margin-bottom:15px}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:12px;padding:12px;border-radius:10px;max-width:90%}
.bubble.user{align-self:flex-start;background:#2b1822}
.bubble.ai{align-self:flex-end;background:#12201f;border:1px solid #29443d}
.mobile-nav{display:none}
@media(max-width:850px){
  .layout{grid-template-columns:180px 1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  header{padding:12px}
  h1{font-size:14px}
  .layout{display:block}
  aside{display:none}
  main{padding:17px 12px 90px}
  h2{font-size:22px}
  .grid{grid-template-columns:1fr}
  .stats{gap:8px}
  .stat{padding:12px}
  .form-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    z-index:10;background:#101117f5;border-top:1px solid var(--border);
    padding:6px;justify-content:space-around
  }
  .mobile-nav button{width:auto;text-align:center;font-size:10px;padding:8px 5px}
  .mobile-nav button span{display:block;font-size:17px;margin-bottom:4px}
  #toast{bottom:80px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">SIS</div>
    <div><h1 id="brand">SIS — NIGHT CITY</h1><p>نظام إدارة المعلومات والشبكات</p></div>
  </div>
  <button class="btn" data-page="search">⌕ البحث</button>
</header>

<div class="layout">
<aside>
  <nav id="sideNav">
    <button class="active" data-page="dashboard">▦ لوحة التحكم</button>
    <button data-page="networks">⌘ NETWORK</button>
    <button data-page="people">♙ الأشخاص</button>
    <button data-page="files">▤ الملفات</button>
    <button data-page="reports">▧ التقارير الاستخباراتية</button>
    <button data-page="search">⌕ البحث المركزي</button>
    <button data-page="ai">✧ SIS AI</button>
    <button data-page="archive">▣ الأرشيف</button>
    <button data-page="settings">⚙ الإعدادات</button>
  </nav>
  <div class="notice">التخزين محلي على هذا المتصفح. لا توجد قاعدة بيانات خارجية.</div>
</aside>

<main id="main"></main>
</div>

<div class="mobile-nav">
  <button data-page="dashboard" class="active"><span>▦</span>الرئيسية</button>
  <button data-page="networks"><span>⌘</span>الشبكات</button>
  <button data-page="people"><span>♙</span>الأشخاص</button>
  <button data-page="search"><span>⌕</span>البحث</button>
  <button data-page="ai"><span>✧</span>SIS AI</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modalTitle">إضافة</h3><button class="btn" data-action="close">✕</button></div>
    <div id="modalContent"></div>
  </div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
